name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Check JavaScript syntax
        run: find src migrations seeders scripts test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
