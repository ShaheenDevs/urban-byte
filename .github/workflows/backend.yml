name: Backend MySQL integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: urban_byte_ci_password
          MYSQL_DATABASE: urban_byte_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -purban_byte_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: urban_byte_test
      DB_USER: root
      DB_PASSWORD: urban_byte_ci_password
      JWT_ACCESS_SECRET: ci_only_dummy_secret_32_chars_minimum_123456
      RUN_DB_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run Sequelize migrations against disposable MySQL
        run: npm run db:migrate
      - name: Seed system roles and permissions
        run: npm run db:seed
      - name: Run unit and MySQL integration tests
        run: npm test
      - name: Check JavaScript syntax
        run: find src migrations seeders scripts test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
